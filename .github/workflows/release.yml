# Builds the all-in-one zip for XAMPP / cPanel (vendor + compiled CSS/JS included)
# and runs the test suite. The zip is attached to the "latest" release on GitHub:
#   https://github.com/shwesiads-ctrl/UnlockHub/releases/tag/latest
# Push a tag like v1.2.0 to make a numbered release too.
name: Build release zip

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_sqlite, sodium, bcmath
          coverage: none
      - name: Composer (with dev tools)
        run: composer install --no-interaction --prefer-dist || composer update --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build CSS/JS
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build
      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, pdo_mysql, sodium, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PHP packages (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || composer update --no-dev --optimize-autoloader --no-interaction --prefer-dist
      - name: Build CSS/JS
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build
      - name: Make zip
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "$VERSION" > VERSION
          mkdir -p release
          zip -qr release/UnlockHub-full.zip . \
            -x '.git/*' '.github/*' 'node_modules/*' 'tests/*' 'release/*' '.env' 'phpunit.xml' '.phpunit.cache/*' \
               'storage/installed' 'storage/logs/*.log' 'storage/framework/sessions/*' 'storage/framework/views/*.php' \
               'storage/framework/cache/data/*' 'bootstrap/cache/*.php' 'public/storage' 'public/hot'
          # keep the empty storage folders (and their .gitignore) so Laravel can write into them
          zip -q release/UnlockHub-full.zip storage/framework/sessions/.gitignore storage/framework/views/.gitignore storage/framework/cache/data/.gitignore 2>/dev/null || true
          cp release/UnlockHub-full.zip "release/UnlockHub-${VERSION}.zip"
          ls -lh release
          unzip -l release/UnlockHub-full.zip | grep -E 'vendor/autoload.php|public/build/manifest.json|public/install.php' 
      - uses: actions/upload-artifact@v4
        with:
          name: UnlockHub-full
          path: release/UnlockHub-full.zip
          retention-days: 30
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release/UnlockHub-full.zip --prerelease --title "Latest build (XAMPP / cPanel)" \
            --notes "All-in-one zip: vendor + compiled CSS/JS included. Upload, extract, open /install.php. Built from ${GITHUB_SHA::7}."
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/UnlockHub-*.zip --title "UnlockHub ${GITHUB_REF_NAME}" --generate-notes
