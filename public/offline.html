<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2459E8">
<title>Offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Myanmar", sans-serif; background: #F4F6FA; color: #0F172A; }
  @media (prefers-color-scheme: dark) { body { background: #0D1220; color: #E8EDF6; } .card { background: #151C2D !important; border-color: #273149 !important; } .muted { color: #9AA5BA !important; } }
  .card { max-width: 420px; margin: 24px; padding: 28px; border-radius: 18px; background: #fff; border: 1px solid #E2E8F0; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { margin: 8px 0; line-height: 1.6; }
  .muted { color: #556070; font-size: 14px; }
  button { margin-top: 16px; height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: #2459E8; color: #fff; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your Wi-Fi or mobile data, then try again.</p>
    <p lang="my">အင်တာနက် မရှိပါ။ Wi-Fi / Mobile data ကို စစ်ပြီး ပြန်ကြိုးစားပါ။</p>
    <p class="muted">No order was sent and nothing was charged while you were offline. Your wallet and orders are only shown when you are online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
